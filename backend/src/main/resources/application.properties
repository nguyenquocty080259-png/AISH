# AI - Chat (Groq via OpenAI-compatible client)
spring.ai.openai.api-key=
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# AI - Model routing: pin chat to OpenAI/Groq and embedding to Gemini so the
# spring-ai-starter-model-google-genai chat autoconfig (and the OpenAI embedding
# autoconfig, which would otherwise point at Groq — no embeddings endpoint there)
# both back off instead of racing to register competing beans.
spring.ai.model.chat=openai
spring.ai.model.embedding=google-genai
spring.ai.model.embedding.text=google-genai

# AI - Embedding (Google Gemini Developer API)
spring.ai.google.genai.embedding.api-key=
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

